name: dot-gov-news-chroma

services:
  chroma:
    container_name: dot-gov-news-chroma
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      CHROMA_ALLOW_RESET: "false"
      CHROMA_PERSIST_PATH: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q ':1F40 ' /proc/net/tcp /proc/net/tcp6 2>/dev/null",
        ]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

volumes:
  chroma-data:
    name: dot-gov-news-chroma-data
