[project]
name = "dot-gov-news-pipeline"
version = "0.1.0"
description = "A pipeline for collecting and processing news from U.S. government websites."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs local Supabase with migrations applied"]
addopts = "-m 'not integration'"
