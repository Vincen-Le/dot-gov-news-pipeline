name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build operator dashboard
        run: pnpm --filter @dot-gov-news/operator-console build

      - name: Check generated CLI cheatsheet
        run: |
          pnpm --filter @dot-gov-news/operator-console docs:generate
          git diff --exit-code -- docs/operations/cli-cheatsheet.md

      - name: Validate Worker bundle
        run: pnpm --filter @dot-gov-news/pipeline-worker check:deploy

      - name: Validate Operator API bundle
        run: pnpm --filter @dot-gov-news/operator-api check:deploy

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase start

      - name: Apply migrations from scratch
        run: pnpm supabase db reset

      - name: Test legacy data migration
        run: pnpm test:migration

      - name: Test database functions and grants
        run: pnpm supabase test db

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop
